name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-eslint:
    uses: timmo001/workflows/.github/workflows/lint-eslint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
  lint-jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
  lint-prettier:
    uses: timmo001/workflows/.github/workflows/lint-prettier.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
